name: "Release"

# The stores reject a build whose version was already uploaded,
# so a release only runs when VERSION changes (or when started by hand).
on:
  push:
    branches: [ "main", "chore/pipeline-techstack" ] # TEMP: test run on branch, remove before merge
    paths: [ "VERSION" ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  deploy-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios deploy
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          CERT_REPO: ${{ secrets.CERT_REPO }}
          APPLE_ID_TESTFLIGHT: ${{ secrets.APPLE_ID_TESTFLIGHT }}

  deploy-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Write signing and Play Console credentials
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > androidApp/release.jks
          echo "$PLAY_CONSOLE_CREDENTIALS_JSON" > fastlane/play-console-credentials.json
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PLAY_CONSOLE_CREDENTIALS_JSON: ${{ secrets.PLAY_CONSOLE_CREDENTIALS_JSON }}

      - name: Build and upload to Play Store
        run: bundle exec fastlane android deploy
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}

  deploy-mac-store:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERTIFICATE_P12_DATA_MACOS_APPSTORE }}
          p12-password: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD_MACOS_APPSTORE }}

      - name: Write provisioning profiles and entitlements
        run: |
          echo "$RUNTIME_PROVISIONPROFILE" | base64 --decode > composeApp/runtime.provisionprofile
          echo "$EMBEDDED_PROVISIONPROFILE" | base64 --decode > composeApp/embedded.provisionprofile
          echo "$ENTITLEMENTS" | base64 --decode > composeApp/entitlements.plist
        env:
          RUNTIME_PROVISIONPROFILE: ${{ secrets.RUNTIME_PROVISIONPROFILE }}
          EMBEDDED_PROVISIONPROFILE: ${{ secrets.EMBEDDED_PROVISIONPROFILE }}
          ENTITLEMENTS: ${{ secrets.ENTITLEMENTS }}

      - name: Build and upload to Mac App Store
        run: bundle exec fastlane macos deploy_store
        env:
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          APPLE_ID_TESTFLIGHT: ${{ secrets.APPLE_ID_TESTFLIGHT }}

      - name: Print error logs on failure
        if: failure()
        run: |
          shopt -s globstar nullglob
          for f in composeApp/build/compose/logs/**/*.txt; do echo "=== $f ==="; cat "$f"; done

  build-mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERTIFICATE_P12_DATA_MACOS }}
          p12-password: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD_MACOS }}

      - name: Write App Store Connect API key
        run: echo "$KEY" > fastlane/mac-api-key.json
        env:
          KEY: ${{ secrets.APPSTORE_CONNECT_API_JSON }}

      - name: Build and notarize DMG
        run: bundle exec fastlane macos deploy_dmg

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Gridline-dmg
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          retention-days: 30

  release-mac:
    needs: [ build-mac, deploy-ios, deploy-android, deploy-mac-store ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Gridline-dmg

      - name: Upload DMG to GitHub release
        run: |
          VERSION=$(cat VERSION)
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes "Release $VERSION"
          gh release upload "$VERSION" "Gridline-$VERSION.dmg" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
